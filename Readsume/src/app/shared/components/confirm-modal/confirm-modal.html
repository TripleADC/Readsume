
@if (confirmModalService.isOpen())
{
    <div class="fixed inset-0 z-40 bg-black/50" (click)="onCancel()"></div>

    <div class="overflow-y-auto overflow-x-hidden fixed inset-0 z-50 flex justify-center items-center">
        <div class="relative p-4 w-full max-w-2xl max-h-full">
            <div class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6">
                <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
                    <button class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
                        (click)="onCancel()">
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                
                <div class="space-y-4 md:space-y-6 py-4 md:py-6">
                    <p class="leading-relaxed text-body">
                        {{ confirmModalService.options.message }}
                    </p>
                    @if (confirmModalService.options.warning)
                    {
                        <p class="leading-relaxed text-body text-red-600">
                            {{ confirmModalService.options.warning }}
                        </p>
                    }
                </div>
                
                <div class="flex items-center border-t border-default space-x-4 pt-4 md:pt-5">
                    <button class="text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
                        (click)="onCancel()">{{ confirmModalService.options.cancelLabel }}</button>
                    <button class="text-white bg-danger box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
                        (click)="onConfirm()">{{ confirmModalService.options.confirmLabel }}</button>
                </div>
            </div>
        </div>
    </div>
}
